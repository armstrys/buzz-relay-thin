# Minimal backing stack for buzz-relay.
#
# The repo's own docker-compose.yml starts six services. The relay only talks to
# three: Postgres, Redis, and object storage. Adminer, Keycloak, and Prometheus
# are dev conveniences and are omitted here.
#
# Two deliberate differences from the repo's dev compose:
#   1. Credentials come from .env instead of being hardcoded to buzz_dev.
#   2. Datastore ports publish to 127.0.0.1 only. The relay runs natively on the
#      host and reaches them over loopback; nothing else should. Only the relay's
#      own port 3000 is exposed to the network.
#
# container_name for postgres is kept as buzz-postgres because the repo's
# scripts/seed-local-community.sh falls back to `docker exec buzz-postgres psql`
# when psql is not installed on the host.

services:
  postgres:
    image: postgres:17-alpine
    container_name: buzz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - buzz-net

  redis:
    image: redis:7-alpine
    container_name: buzz-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - buzz-net

  minio:
    image: minio/minio:latest
    container_name: buzz-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${BUZZ_S3_ACCESS_KEY:?set BUZZ_S3_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${BUZZ_S3_SECRET_KEY:?set BUZZ_S3_SECRET_KEY in .env}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      # If this image lacks curl, swap to: ["CMD", "mc", "ready", "local"]
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - buzz-net

  # Creates the media bucket once, then exits. Uses the compose network, so it
  # addresses minio by service name rather than through the published port.
  minio-init:
    image: minio/mc:latest
    container_name: buzz-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 '${BUZZ_S3_ACCESS_KEY}' '${BUZZ_S3_SECRET_KEY}' &&
        mc mb --ignore-existing local/${BUZZ_S3_BUCKET:-buzz-media} &&
        mc anonymous set none local/${BUZZ_S3_BUCKET:-buzz-media}
      "
    restart: "no"
    networks:
      - buzz-net

volumes:
  postgres-data:
  redis-data:
  minio-data:

networks:
  buzz-net:
    driver: bridge
